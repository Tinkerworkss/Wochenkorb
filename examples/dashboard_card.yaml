# Offers card with tabs, search and add-to-list button. Paste as a manual card.
# Tab and search are kept per device (browser_mod); devices without their own helpers share
# input_select.angebote_reiter and input_text.angebote_suche.
# Replace DEINE_PLZ with your ZIP code and GERAET_1 with the browser_mod id of a device
# (without the leading browser_mod_). For more devices copy the two cards that contain GERAET_1,
# add the helpers to every triggers_update list and extend the nth-child rules in card_mod at the end
# (they hide cards by their position in the stack).
type: vertical-stack
cards:
- type: heading
  heading: Angebote der Woche
  icon: mdi:tag-multiple
  heading_style: title
- type: entities
  entities:
  - entity: input_text.angebote_suche
    name: Suche in den Prospekten
    icon: mdi:magnify
  card_mod:
    style:
      .: |-
        ha-card { border-radius: 16px; }
        #states { padding: 0 12px; }
      hui-input-text-entity-row $ ha-input $ wa-input $: 'input::placeholder { color: transparent !important; }'
- type: entities
  entities:
  - entity: input_text.angebote_suche_GERAET_1
    name: Suche in den Prospekten
    icon: mdi:magnify
  card_mod:
    style:
      .: |-
        ha-card { border-radius: 16px; }
        #states { padding: 0 12px; }
      hui-input-text-entity-row $ ha-input $ wa-input $: 'input::placeholder { color: transparent !important; }'
- type: horizontal-stack
  cards:
  - type: custom:button-card
    name: '[[[ const gid = (localStorage.getItem(''browser_mod-browser-id'') || '''').replace(''browser_mod_'', ''''); const re = states[''input_select.angebote_reiter_'' + gid] ? ''input_select.angebote_reiter_'' + gid : ''input_select.angebote_reiter''; const se = states[''input_text.angebote_suche_'' + gid] ? ''input_text.angebote_suche_'' + gid : ''input_text.angebote_suche''; const sucht = states[se] && !['''', ''unknown'', ''unavailable''].includes(states[se].state); const L = ((states[''sensor.wochenkorb_suchbegriffe_DEINE_PLZ''] || {attributes: {}}).attributes.listen || [])[0]; return L ? L.name : ''''; ]]]'
    icon: '[[[ const gid = (localStorage.getItem(''browser_mod-browser-id'') || '''').replace(''browser_mod_'', ''''); const re = states[''input_select.angebote_reiter_'' + gid] ? ''input_select.angebote_reiter_'' + gid : ''input_select.angebote_reiter''; const se = states[''input_text.angebote_suche_'' + gid] ? ''input_text.angebote_suche_'' + gid : ''input_text.angebote_suche''; const sucht = states[se] && !['''', ''unknown'', ''unavailable''].includes(states[se].state); const L = ((states[''sensor.wochenkorb_suchbegriffe_DEINE_PLZ''] || {attributes: {}}).attributes.listen || [])[0]; return (L && L.icon) || ''mdi:format-list-bulleted''; ]]]'
