card_mod:
  style: |-
    {%- set gid = (browser or '') | replace('browser_mod_', '') -%}{%- set rs = states['input_select.angebote_reiter_' ~ gid] if gid else none -%}{%- set qs = states['input_text.angebote_suche_' ~ gid] if gid else none -%}{%- set reiter = rs.state if rs else states('input_select.angebote_reiter') -%}{%- set q = qs.state if qs else states('input_text.angebote_suche') -%}{%- set sucht = q not in ['', 'unknown', 'unavailable'] -%}{%- set listen = state_attr('sensor.wochenkorb_suchbegriffe_DEINE_PLZ', 'listen') or [] -%}{%- set nl = listen | count -%}
    {%- if qs %}
    #root > :nth-child(2) { display: none !important; }
    {%- endif %}
    {%- if gid != 'GERAET_1' %}
    #root > :nth-child(3) { display: none !important; }
    {%- endif %}
    {%- if sucht %}
    #root > :nth-child(4) { display: none !important; }
    {%- endif %}
    {%- if not sucht %}
    #root > :nth-child(5) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 0 or reiter != listen[0].name %}
    #root > :nth-child(6) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 1 or reiter != listen[1].name %}
    #root > :nth-child(7) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 2 or reiter != listen[2].name %}
    #root > :nth-child(8) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 3 or reiter != listen[3].name %}
    #root > :nth-child(9) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 4 or reiter != listen[4].name %}
    #root > :nth-child(10) { display: none !important; }
    {%- endif %}
    {%- if sucht or nl <= 5 or reiter != listen[5].name %}
    #root > :nth-child(11) { display: none !important; }
    {%- endif %}
    {%- if sucht or reiter != 'Marktkauf' %}
    #root > :nth-child(12) { display: none !important; }
    {%- endif %}
    {%- if sucht or reiter != 'REWE' %}
    #root > :nth-child(13) { display: none !important; }
    {%- endif %}
    {%- if sucht or reiter != 'EDEKA' %}
    #root > :nth-child(14) { display: none !important; }
    {%- endif %}
    {%- if not sucht or qs %}
    #root > :nth-child(15) { display: none !important; }
    {%- endif %}
    {%- if not sucht or gid != 'GERAET_1' %}
    #root > :nth-child(16) { display: none !important; }
    {%- endif %}
