# Recipe suggestions from Mealie whose main ingredient is on offer. Paste as a manual card.
# Needs the option mealie_recipes of the integration, browser_mod (popup), the script
# script_rezept_einplanen.yaml and the helper input_button.rezepte_neu_mischen (button Andere Vorschläge). Replace DEINE_PLZ with your ZIP code.
type: vertical-stack
cards:
- type: heading
  heading: Rezepte zu den Angeboten
  icon: mdi:chef-hat
  heading_style: title
- type: entities
  entities:
  - entity: input_text.rezept_suche
    name: Rezept suchen (Name oder Zutat)
    icon: mdi:magnify
  card_mod:
    style:
      .: |-
        ha-card { border-radius: 16px; }
        #states { padding: 0 12px; }
      hui-input-text-entity-row $ ha-input $ wa-input $: 'input::placeholder { color: transparent !important; }'
- type: conditional
  conditions:
  - condition: state
    entity: input_text.rezept_suche
    state_not: ''
  card:
    type: custom:button-card
    name: Suche beenden, Vorschläge zeigen
    icon: mdi:close
    layout: icon_name
    tap_action:
      action: call-service
      service: input_text.set_value
      service_data:
        entity_id: input_text.rezept_suche
        value: ''
    styles:
      card:
      - padding: 9px 14px
      - border-radius: 12px
      - border: none
      - box-shadow: none
      - background: rgba(127,127,127,0.18)
      icon:
      - width: 20px
      name:
      - font-size: 14px
      - font-weight: '600'
      grid:
      - grid-template-columns: min-content min-content
      - justify-content: center
      - column-gap: 6px
- type: horizontal-stack
  cards:
  - type: custom:button-card
    icon: mdi:chevron-left
    show_name: false
    tap_action:
      action: call-service
      service: input_number.decrement
      service_data:
        entity_id: input_number.essen_woche
    styles:
      card:
      - padding: 8px
      - height: 58px
      - border-radius: 12px
      - border: none
      - box-shadow: none
      - background: rgba(127,127,127,0.18)
      icon:
      - width: 22px
  - type: custom:button-card
    entity: input_number.essen_woche
    show_icon: false
    show_state: false
    name: '[[[ const o = parseInt(entity.state) || 0; if (o === 0) return ''Ab heute''; const a = new Date(); a.setDate(a.getDate() + o * 7); const b = new Date(a); b.setDate(b.getDate() + 6); const f = d => d.toLocaleDateString(''de-DE'', {day: ''2-digit'', month: ''2-digit''}); return f(a) + '' – '' + f(b) + (o < 0 ? '' · Rückblick'' : ''''); ]]]'
    label: '[[[ return (parseInt(entity.state) || 0) === 0 ? '''' : ''Tippen: zurück zu heute''; ]]]'
    show_label: true
    tap_action:
      action: call-service
      service: input_number.set_value
      service_data:
        entity_id: input_number.essen_woche
        value: 0
    styles:
      card:
      - padding: 6px 10px
      - height: 58px
      - border-radius: 12px
      - border: none
      - box-shadow: none
      - background: rgba(127,127,127,0.18)
      name:
      - font-size: 14px
      - font-weight: '600'
      label:
      - font-size: 11px
      - opacity: '0.7'
  - type: custom:button-card
    icon: mdi:chevron-right
    show_name: false
    tap_action:
      action: call-service
      service: input_number.increment
      service_data:
        entity_id: input_number.essen_woche
    styles:
      card:
      - padding: 8px
      - height: 58px
      - border-radius: 12px
      - border: none
      - box-shadow: none
      - background: rgba(127,127,127,0.18)
      icon:
      - width: 22px
  card_mod:
    style: |-
      #root { display: grid !important; grid-template-columns: 52px 1fr 52px; gap: 8px; }
      #root > * { margin: 0 !important; min-width: 0; }
- type: custom:mod-card
  card_mod:
    style:
      hui-horizontal-stack-card $: |-
        #root { display: flex !important; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px; scrollbar-width: none; }
        #root::-webkit-scrollbar { display: none; }
        #root > *, #root > * > * { flex: 1 0 76px !important; margin: 0 !important; min-width: 76px !important; max-width: 132px !important; scroll-snap-align: start; }
      .: 'ha-card { background: none !important; border: none !important; box-shadow: none !important; overflow: visible; }'
  card:
    type: custom:auto-entities
    show_empty: true
    card_param: cards
    card:
      type: horizontal-stack
    filter:
      template: |-
        {#- Die Abende als Kachelreihe: Rezept, freier Eintrag oder noch frei. Ein Tipp öffnet das Rezept mit den Plan-Aktionen bzw. das Fenster für einen freien Eintrag -#}
        {%- set wt = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'] -%}
        {%- set stil = {
          'card': [{'padding': '9px 14px'}, {'border-radius': '0'}, {'border': 'none'}, {'border-bottom': '1px solid var(--divider-color)'}, {'box-shadow': 'none'}, {'background': 'none'}],
          'grid': [{'grid-template-areas': '"n l"'}, {'grid-template-columns': '96px 1fr'}, {'grid-template-rows': 'auto'}, {'grid-auto-rows': '0px'}, {'column-gap': '10px'}, {'align-items': 'center'}],
          'name': [{'justify-self': 'start'}, {'font-size': '14px'}, {'font-weight': '600'}],
          'label': [{'justify-self': 'start'}, {'text-align': 'left'}, {'font-size': '14px'}, {'white-space': 'normal'}]} -%}
        {%- set rows = namespace(l=[]) -%}
        {#- Portionenzahl je Planeintrag (nur gemerkt, wenn über die Karte eingeplant) -#}
        {%- set std = states('input_number.einkauf_portionen') | float(0) -%}
        {%- set pm = namespace(d={}) -%}
        {%- set alt = states('input_text.einkauf_portionen_plan') -%}
        {%- for x in (alt.split(';') if alt not in ['unknown', 'unavailable', ''] else []) if '=' in x -%}{%- set pm.d = dict(pm.d, **{x.split('=')[0]: x.split('=')[1] | float(0)}) -%}{%- endfor -%}
        {#- Blättern: 0 = die sieben Tage ab heute, -1 = die sieben davor, 1 = die sieben danach (Helfer input_number.essen_woche) -#}
        {%- set off = states('input_number.essen_woche') | int(0) -%}
        {%- set kal = state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'kalender') or {} -%}
        {%- set det = state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'plan_details') or {} -%}
        {%- set woche = namespace(l=[]) -%}
        {%- for i in range(10) -%}
        {%- set dd = (now().date() + timedelta(days=off * 7 + i)).isoformat() -%}
        {%- set woche.l = woche.l + [{'date': dd, 'dinner': kal.get(dd, [])}] -%}
        {%- endfor -%}
        {#- Die sieben Tage mit dem, was dort schon steht: Ziele zum Verschieben -#}
        {%- set tage = namespace(l=[]) -%}
        {%- for p in woche.l -%}
        {%- set d = strptime(p.date, '%Y-%m-%d') -%}
        {%- set diff = (d.date() - now().date()).days -%}
        {%- if diff >= 0 -%}
        {%- set tage.l = tage.l + [{'d': p.date, 'text': 'Heute' if diff == 0 else ('Morgen' if diff == 1 else wt[d.weekday()][:2] ~ ', ' ~ d.strftime('%d.%m.')), 'essen': p.dinner | map(attribute='name') | join(', ')}] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- for p in woche.l -%}
        {%- set d = strptime(p.date, '%Y-%m-%d') -%}
        {%- set diff = (d.date() - now().date()).days -%}
        {#- Vergangene Tage sind nur zum Ansehen -#}
        {%- if true -%}
        {%- set tag = 'Heute' if diff == 0 else ('Morgen' if diff == 1 else wt[d.weekday()][:2] ~ ', ' ~ d.strftime('%d.%m.')) -%}
        {%- if p.dinner | count == 0 -%}
        {#- Freier Abend: Tipp öffnet ein Fenster für eine freie Notiz (Pizza auswärts, Reste, ...), die nicht an ein Rezept gebunden ist -#}
        {%- set schnell = namespace(l=[]) -%}
        {%- for txt in ['Auswärts essen', 'Bestellen', 'Reste', 'Brotzeit'] -%}
        {%- set schnell.l = schnell.l + [{'type': 'custom:button-card', 'name': txt, 'show_icon': 0,
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
            {'service': 'browser_mod.close_popup', 'data': {}},
            {'service': 'script.einkauf_essen_notieren', 'data': {'datum': p.date, 'text': txt}}]}}},
          'styles': {'card': [{'padding': '10px 6px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(127,127,127,0.18)'}],
                     'name': [{'font-size': '13px'}, {'font-weight': '600'}]}}] -%}
        {%- endfor -%}
        {%- set notiz = {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
          {'service': 'input_text.set_value', 'data': {'entity_id': 'input_text.essen_notiz', 'value': ''}},
          {'service': 'browser_mod.popup', 'data': {'title': tag ~ ': Was gibt es?', 'content': {'type': 'vertical-stack', 'cards': [
            {'type': 'markdown', 'content': 'Eigener Eintrag ohne Rezept, zum Beispiel „Pizza auswärts“. Es kommt nichts auf die Einkaufsliste.'},
            {'type': 'horizontal-stack', 'cards': schnell.l[:2]}, {'type': 'horizontal-stack', 'cards': schnell.l[2:]},
            {'type': 'entities', 'entities': [{'entity': 'input_text.essen_notiz', 'name': 'Eigener Text'}]},
            {'type': 'custom:button-card', 'name': 'Eintragen', 'icon': 'mdi:check', 'layout': 'icon_name',
             'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
               {'service': 'browser_mod.close_popup', 'data': {}},
               {'service': 'script.einkauf_essen_notieren', 'data': {'datum': p.date}}]}}},
             'styles': {'card': [{'padding': '10px 14px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'var(--primary-color)'}, {'color': 'var(--text-primary-color, #fff)'}],
                        'icon': [{'width': '20px'}, {'color': 'var(--text-primary-color, #fff)'}], 'grid': [{'grid-template-columns': 'min-content min-content'}, {'justify-content': 'center'}, {'column-gap': '6px'}]}}]}}}]}}} -%}
        {%- set rows.l = rows.l + [{'type': 'custom:button-card', 'template': 'rezept_kachel', 'tap_action': notiz if diff >= 0 else {'action': 'none'}, 'variables': {'art': 'frei', 'bild': '', 'name': '', 'tag': tag, 'heute': 1 if diff == 0 else 0, 'alt': 1 if diff < 0 else 0}}] -%}
        {%- endif -%}
        {%- for e in p.dinner -%}
        {%- set weg = {'type': 'custom:button-card', 'name': 'Vom Plan nehmen', 'icon': 'mdi:calendar-remove', 'layout': 'icon_name',
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
            {'service': 'browser_mod.close_popup', 'data': {}},
            {'service': 'browser_mod.notification', 'data': {'message': '„' ~ e.name ~ '“ wird vom Plan genommen, die Zutaten gehen von der Einkaufsliste', 'duration': 6000}},
            {'service': 'script.einkauf_rezept_ausplanen', 'data': {'slug': e.slug, 'datum': p.date}}]}}},
          'styles': {'card': [{'padding': '10px 14px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(214,69,61,0.9)'}, {'color': '#fff'}],
                     'icon': [{'width': '20px'}, {'color': '#fff'}], 'grid': [{'grid-template-columns': 'min-content min-content'}, {'justify-content': 'center'}, {'column-gap': '6px'}]}} -%}
        {%- set port = pm.d.get(e.id | string, 0) -%}
        {%- set ptext = (port | round(1) | string | replace('.0', '') | replace('.', ',')) ~ ' Port.' -%}
        {%- set mengen = namespace(l=[]) -%}
        {%- for o in [2, 3, 4, 6, 8] if o != port -%}
        {%- set mengen.l = mengen.l + [{'type': 'custom:button-card', 'name': o ~ ' Port.', 'show_icon': 0,
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
            {'service': 'browser_mod.close_popup', 'data': {}},
            {'service': 'browser_mod.notification', 'data': {'message': '„' ~ e.name ~ '“ wird auf ' ~ o ~ ' Portionen umgerechnet, die Einkaufsliste wird angepasst', 'duration': 6000}},
            {'service': 'script.einkauf_rezept_portionen', 'data': {'slug': e.slug, 'datum': p.date, 'portionen': o}}]}}},
          'styles': {'card': [{'padding': '8px 4px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(127,127,127,0.18)'}],
                     'name': [{'font-size': '13px'}, {'font-weight': '600'}]}}] -%}
        {%- endfor -%}
        {%- set ziele = namespace(l=[]) -%}
        {%- for t in tage.l if t.d != p.date -%}
        {%- set ziele.l = ziele.l + [{'type': 'custom:button-card', 'name': t.text, 'label': t.essen or 'frei', 'show_icon': 0, 'show_label': 1,
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
            {'service': 'browser_mod.close_popup', 'data': {}},
            {'service': 'browser_mod.notification', 'data': {'message': '„' ~ e.name ~ '“ wird auf ' ~ t.text ~ ' verschoben', 'duration': 4000}},
            {'service': 'script.einkauf_rezept_verschieben', 'data': {'slug': e.slug, 'von': p.date, 'nach': t.d}}]}}},
          'styles': {
            'card': [{'padding': '10px 14px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(127,127,127,0.18)'}],
            'grid': [{'grid-template-areas': '"n l"'}, {'grid-template-columns': 'auto 1fr'}, {'column-gap': '12px'}],
            'name': [{'justify-self': 'start'}, {'font-size': '15px'}, {'font-weight': '600'}],
            'label': [{'justify-self': 'end'}, {'font-size': '13px'}, {'opacity': '0.8'}, {'text-align': 'right'}]}}] -%}
        {%- endfor -%}
        {%- set klein = {'card': [{'padding': '9px 4px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(127,127,127,0.18)'}], 'name': [{'font-size': '13px'}, {'font-weight': '600'}], 'icon': [{'width': '18px'}], 'grid': [{'grid-template-columns': 'min-content min-content'}, {'justify-content': 'center'}, {'column-gap': '5px'}]} -%}
        {%- set k_schieben = {'type': 'custom:button-card', 'name': 'Verschieben', 'icon': 'mdi:calendar-arrow-right', 'layout': 'icon_name', 'styles': klein,
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.popup', 'data': {'title': e.name, 'content': {'type': 'vertical-stack', 'cards':
            [{'type': 'markdown', 'content': 'Geplant für **' ~ tag ~ '**. Auf einen anderen Abend legen:'}] + ziele.l}}}}} -%}
        {%- set k_port = ({'type': 'custom:button-card', 'name': ptext, 'icon': 'mdi:account-multiple', 'layout': 'icon_name', 'styles': klein,
          'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.popup', 'data': {'title': e.name, 'content': {'type': 'vertical-stack', 'cards':
            [{'type': 'markdown', 'content': 'Eingekauft wird für **' ~ ptext ~ '** Ändern auf:'}, {'type': 'horizontal-stack', 'cards': mengen.l}]}}}}}) if port > 0 else
          {'type': 'custom:button-card', 'name': 'Zutaten', 'icon': 'mdi:cart-plus', 'layout': 'icon_name', 'styles': klein,
           'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
             {'service': 'browser_mod.close_popup', 'data': {}},
             {'service': 'browser_mod.notification', 'data': {'message': 'Die Zutaten für „' ~ e.name ~ '“ kommen auf die Einkaufsliste', 'duration': 6000}},
             {'service': 'script.einkauf_rezept_zutaten', 'data': {'slug': e.slug, 'datum': p.date}}]}}}} -%}
        {%- set k_weg = dict(weg, name='Entfernen', styles=dict(klein, card=klein.card[:4] + [{'background': 'rgba(214,69,61,0.9)'}, {'color': '#fff'}], icon=[{'width': '18px'}, {'color': '#fff'}])) -%}
        {#- Rezepttext: Bild, Zutaten, Zubereitung; für weiter entfernte Wochen liegen sie nicht vor -#}
        {%- set dt = det.get(e.slug or '', none) -%}
        {%- set bildurl = e.image | default('') -%}
        {%- set text = namespace(s='') -%}
        {%- if bildurl -%}{%- set text.s = '<img src="' ~ bildurl ~ '" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px">\n\n' -%}{%- endif -%}
        {%- if dt -%}
        {%- set zut = namespace(l=[]) -%}{%- for z in dt.ingredients -%}{%- set zut.l = zut.l + ['- ' ~ (z | regex_replace('^(\\d+)\\.0(?=\\s)', '\\1'))] -%}{%- endfor -%}
        {%- set sch = namespace(l=[]) -%}{%- for z in dt.steps -%}{%- set sch.l = sch.l + [loop.index ~ '. ' ~ (z | regex_replace('\\s*\\n+\\s*', ' '))] -%}{%- endfor -%}
        {%- set text.s = text.s ~ ('**Dauer:** ' ~ dt.time ~ '\n\n' if dt.time else '') ~ '### Zutaten\n' ~ (zut.l | join('\n')) ~ '\n\n### Zubereitung\n' ~ (sch.l | join('\n')) -%}
        {%- else -%}
        {%- set text.s = text.s ~ 'Zutaten und Zubereitung stehen in Mealie.' -%}
        {%- endif -%}
        {%- set kopf = 'Geplant für **' ~ tag ~ '**' ~ ((' · ' ~ ptext) if port > 0 else '') -%}
        {%- set tipp = ({'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.popup', 'data': {'title': e.name, 'content': {'type': 'vertical-stack', 'cards':
            ([{'type': 'horizontal-stack', 'cards': [k_schieben, k_port, k_weg]}] if diff >= 0 else []) +
            [{'type': 'markdown', 'content': kopf ~ '\n\n' ~ text.s}]}}}}) if e.slug else
          ({'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.popup', 'data': {'title': e.name, 'content': {'type': 'vertical-stack', 'cards': [
             {'type': 'markdown', 'content': 'Eigener Eintrag für **' ~ tag ~ '**, ohne Rezept.'},
             dict(weg, tap_action={'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
               {'service': 'browser_mod.close_popup', 'data': {}},
               {'service': 'script.einkauf_essen_notiz_entfernen', 'data': {'eintrag': e.id}}]}}})]}}}} if e.id and diff >= 0 else {'action': 'none'}) -%}
        {%- set rows.l = rows.l + [{'type': 'custom:button-card', 'template': 'rezept_kachel', 'tap_action': tipp, 'variables': {'art': 'rezept' if e.slug else 'notiz', 'bild': e.image | default(''), 'name': e.name | e, 'tag': tag, 'heute': 1 if diff == 0 else 0, 'alt': 1 if diff < 0 else 0}}] -%}
        {%- endfor -%}
        {%- endif -%}
        {%- endfor -%}
        {{ rows.l | tojson }}
- type: custom:auto-entities
  show_empty: true
  card:
    type: entities
    card_mod:
      style:
        .: |-
          ha-card { overflow-x: hidden; border-radius: 16px; }
          #states { padding: 0 0 4px; }
          #states > * { margin: 0 !important; }
          #states > div > * { overflow: visible; }
  filter:
    template: |-
      {#- Steht etwas im Suchfeld, zeigt die Karte Treffer aus der ganzen Mealie-Sammlung statt der Vorschläge zu den Angeboten -#}
      {%- set sq = states('input_text.rezept_suche') -%}
      {%- set sucht = sq not in ['', 'unknown', 'unavailable'] -%}
      {%- set res = (state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'search_results') if sucht else state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'results')) or [] -%}
      {%- set rows = namespace(l=[]) -%}
      {%- if res | count == 0 -%}
      {%- set rows.l = [{'type': 'section', 'label': ('Kein Rezept mit „' ~ sq ~ '“ gefunden') if sucht else 'Gerade passt kein Rezept zu den Angeboten'}] -%}
      {%- endif -%}
      {#- Die nächsten Abende für die Tagesauswahl; nach 18 Uhr beginnt die Liste mit morgen -#}
      {%- set wt = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'] -%}
      {%- set ab = (now().date() + timedelta(days=(1 if now().hour >= 18 else 0))).isoformat() -%}
      {%- set tage = namespace(l=[], vor='') -%}
      {#- Ist im Wochenplan vorgeblättert, gelten dessen sieben Tage; so lässt sich auch weiter im Voraus planen -#}
      {%- set off = states('input_number.essen_woche') | int(0) -%}
      {%- set kal = state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'kalender') or {} -%}
      {%- set quelle = namespace(l=state_attr('sensor.wochenkorb_rezepte_DEINE_PLZ', 'plan') or []) -%}
      {%- if off > 0 -%}
      {%- set quelle.l = [] -%}
      {%- for i in range(7) -%}
      {%- set dd = (now().date() + timedelta(days=off * 7 + i)).isoformat() -%}
      {%- set quelle.l = quelle.l + [{'date': dd, 'dinner': kal.get(dd, [])}] -%}
      {%- endfor -%}
      {%- endif -%}
      {%- for p in quelle.l if p.date >= ab -%}
      {%- set d = strptime(p.date, '%Y-%m-%d') -%}
      {%- set essen = p.dinner | map(attribute='name') | join(', ') -%}
      {%- if not essen and not tage.vor -%}{%- set tage.vor = p.date -%}{%- endif -%}
      {%- set tage.l = tage.l + [{'d': p.date, 'text': wt[d.weekday()] ~ ', ' ~ d.strftime('%d.%m.'), 'essen': essen}] -%}
      {%- endfor -%}
      {#- Portionen-Zeile: Haushaltsgröße und zwei größere Mengen; die Auswahl liegt in input_number.rezept_portionen_wahl -#}
      {%- set std = states('input_number.einkauf_portionen') | float(0) -%}
      {%- set opts = [std] + ([4, 6, 8] | select('gt', std) | list)[:2] -%}
      {%- set pk = namespace(l=[]) -%}
      {%- for o in opts -%}
      {%- set pk.l = pk.l + [{'type': 'custom:button-card', 'entity': 'input_number.rezept_portionen_wahl', 'show_icon': 0, 'show_state': 0,
        'name': ((o | round(1) | string | replace('.0', '') | replace('.', ',')) ~ ' Port.') if o > 0 else 'wie im Rezept',
        'tap_action': {'action': 'call-service', 'service': 'input_number.set_value', 'service_data': {'entity_id': 'input_number.rezept_portionen_wahl', 'value': o}},
        'state': [{'operator': '==', 'value': o, 'styles': {'card': [{'background': 'var(--primary-color)'}, {'color': 'var(--text-primary-color, #fff)'}]}}],
        'styles': {'card': [{'padding': '8px 6px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'}, {'background': 'rgba(127,127,127,0.18)'}],
                   'name': [{'font-size': '14px'}, {'font-weight': '600'}]}}] -%}
      {%- endfor -%}
      {#- Eingeplantes steht oben, darunter die Vorschläge; wie viele, entscheidet der Sensor -#}
      {%- for r in res[:12] if sucht or not r.planned -%}
      {%- set o = r.offer or {'retailer': '', 'price': 0} -%}
      {%- set h = (o.retailer or '') | lower -%}
      {%- set markt = 'Marktkauf' if h.startswith('marktkauf') else ('REWE' if h.startswith('rewe') else ('EDEKA' if h.startswith('edeka') else (o.retailer or ''))) -%}
      {%- set preis = '%.2f' | format(o.price | float(0)) | replace('.', ',') -%}
      {%- set info = (r.ingredient ~ ' · ' ~ markt ~ ' ' ~ preis ~ ' €') if r.offer else 'gerade nicht im Angebot' -%}
      {%- set zl = strptime(r.last_cooked, '%Y-%m-%d') if r.last_cooked | default('') else none -%}
      {%- set mehr = [('auch im Angebot: ' ~ (r.also_on_offer[:3] | join(', '))) if r.also_on_offer else '', ('zuletzt am ' ~ wt[zl.weekday()] ~ ', ' ~ zl.strftime('%d.%m.')) if zl else ''] | select | join(' · ') -%}
      {#- Eingeplante Rezepte bleiben stehen; Hauptzutaten, die schon auf der Einkaufsliste stehen, werden genannt -#}
      {%- set tag = strptime(r.planned, '%Y-%m-%d') if r.planned else none -%}
      {%- set geplant = ('eingeplant für ' ~ wt[tag.weekday()] ~ ', ' ~ tag.strftime('%d.%m.')) if tag else '' -%}
      {#- Keine true/false in den Zeilen: Home Assistant liefert die Liste sonst als Text und auto-entities zeigt nichts -#}
      {#- Kalender-Knopf: Fenster mit den Abenden; die Auswahl läuft auf dem Gerät selbst und braucht keine browser_mod-Registrierung -#}
      {%- set knoepfe = namespace(l=[{'type': 'markdown', 'content': '**' ~ r.name ~ '**

      Tippe auf den Abend. Der Vorschlag ist der nächste freie.'}, {'type': 'horizontal-stack', 'cards': pk.l}]) -%}
      {%- for t in tage.l -%}
      {%- set vor = t.d == tage.vor -%}
      {%- set knoepfe.l = knoepfe.l + [{
        'type': 'custom:button-card', 'name': t.text ~ (' · Vorschlag' if vor else ''), 'label': t.essen or 'frei', 'show_icon': 0, 'show_label': 1,
        'tap_action': {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
          {'service': 'browser_mod.close_popup', 'data': {}},
          {'service': 'browser_mod.notification', 'data': {'message': '„' ~ r.name ~ '“ wird für ' ~ t.text ~ ' eingeplant, die Zutaten kommen auf die Einkaufsliste', 'duration': 6000}},
          {'service': 'script.einkauf_rezept_einplanen', 'data': {'slug': r.slug, 'name': r.name, 'datum': t.d}}]}}},
        'styles': {
          'card': [{'padding': '10px 14px'}, {'border-radius': '12px'}, {'border': 'none'}, {'box-shadow': 'none'},
                   {'background': 'var(--primary-color)' if vor else 'rgba(127,127,127,0.18)'},
                   {'color': 'var(--text-primary-color, #fff)' if vor else 'var(--primary-text-color)'}],
          'grid': [{'grid-template-areas': '"n l"'}, {'grid-template-columns': 'auto 1fr'}, {'column-gap': '12px'}],
          'name': [{'justify-self': 'start'}, {'font-size': '15px'}, {'font-weight': '600'}],
          'label': [{'justify-self': 'end'}, {'font-size': '13px'}, {'opacity': '0.8'}, {'text-align': 'right'}]}}] -%}
      {%- endfor -%}
      {%- set tipp = {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.notification', 'data': {'message': 'Schon ' ~ geplant}}} if geplant else {'action': 'fire-dom-event', 'browser_mod': {'service': 'browser_mod.sequence', 'data': {'sequence': [
          {'service': 'input_number.set_value', 'data': {'entity_id': 'input_number.rezept_portionen_wahl', 'value': std}},
          {'service': 'browser_mod.popup', 'data': {'title': 'Wann kochen?', 'content': {'type': 'vertical-stack', 'cards': knoepfe.l}}}]}}} -%}
      {%- set drauf = ((r.on_list | join(', ')) ~ ' schon auf der Liste') if r.on_list else '' -%}
      {%- set status = [geplant, drauf] | select | join(' · ') -%}
      {%- set rows.l = rows.l + [{'type': 'custom:button-card', 'template': 'rezept_zeile', 'custom_fields': {'plus': {'card': {'tap_action': tipp}}}, 'variables': {'bild': r.image or '', 'name': r.name | e, 'titel': r.name, 'info': info | e, 'mehr': mehr | e, 'status': status | e, 'geplant': geplant, 'tag': (wt[tag.weekday()][:2] ~ ', ' ~ tag.strftime('%d.%m.')) if tag else '', 'rabatt': r.discount | int(0), 'slug': r.slug, 'zeit': r.time or '', 'zutaten': r.ingredients, 'schritte': r.steps}}] -%}
      {%- endfor -%}
      {{ rows.l | tojson }}
- type: custom:button-card
  name: Andere Vorschläge
  icon: mdi:shuffle-variant
  layout: icon_name
  tap_action:
    action: call-service
    service: input_button.press
    service_data:
      entity_id: input_button.rezepte_neu_mischen
  styles:
    card:
    - padding: 9px 14px
    - border-radius: 12px
    - border: none
    - box-shadow: none
    - background: rgba(127,127,127,0.18)
    icon:
    - width: 20px
    name:
    - font-size: 14px
    - font-weight: '600'
    grid:
    - grid-template-columns: min-content min-content
    - justify-content: center
    - column-gap: 6px
