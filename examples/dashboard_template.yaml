# Add this block at the top level of the dashboard (raw configuration editor).
# If the dashboard already has button_card_templates, add only the three entries.
button_card_templates:
  angebot_zeile:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - padding: 7px 8px 7px 14px
      - border-radius: '0'
      - border: none
      - border-bottom: 1px solid var(--divider-color)
      - box-shadow: none
      - background: none
      - cursor: default
      grid:
      - grid-template-areas: '"info preis plus"'
      - grid-template-columns: 1fr auto 42px
      - column-gap: 8px
      - align-items: center
      custom_fields:
        info:
        - justify-self: stretch
        - min-width: '0'
        preis:
        - justify-self: end
        - text-align: right
        - white-space: nowrap
        plus:
        - justify-self: end
    custom_fields:
      info:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: url
            url_path: '[[[ return variables.link ]]]'
          styles:
            card:
            - padding: '0'
            - border: none
            - box-shadow: none
            - background: none
            - border-radius: '0'
            grid:
            - grid-template-areas: '"img text"'
            - grid-template-columns: 46px 1fr
            - column-gap: 8px
            - align-items: center
            custom_fields:
              text:
              - justify-self: start
              - text-align: left
              - white-space: normal
              - min-width: '0'
          custom_fields:
            img: '[[[ return variables.bild ? `<img src="${variables.bild}" style="width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;display:block">` : ''''; ]]]'
            text: '[[[ return `<div style="font-size:14px;line-height:1.3">${variables.name}</div>` + (variables.infos ? `<div style="font-size:12px;line-height:1.3;color:var(--secondary-text-color)">${variables.infos}</div>` : ''''); ]]]'
      preis: '[[[ return `<div style="font-size:17px;font-weight:600;line-height:1.25">${variables.preis} €</div>` + (variables.alt ? `<div style="font-size:12px;line-height:1.3;color:var(--secondary-text-color)"><s>${variables.alt} €</s> <span style="font-size:11px;font-weight:600;color:#fff;background:#d6453d;border-radius:4px;padding:1px 5px">−${variables.rabatt} %</span></div>` : ''''); ]]]'
      plus:
        card:
          type: custom:button-card
          icon: mdi:cart-plus
          show_name: false
          show_state: false
          tap_action:
            action: call-service
            service: todo.add_item
            service_data:
              entity_id: todo.einkauf_bring
              item: '[[[ return variables.eintrag ]]]'
              description: '[[[ return variables.notiz ]]]'
            data:
              entity_id: todo.einkauf_bring
              item: '[[[ return variables.eintrag ]]]'
              description: '[[[ return variables.notiz ]]]'
          styles:
            card:
            - width: 38px
            - height: 38px
            - padding: '0'
            - border-radius: 50%
            - border: none
            - box-shadow: none
            - background: rgba(127,127,127,0.2)
            icon:
            - width: 20px
            - color: var(--primary-text-color)
  rezept_zeile:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - padding: '[[[ return variables.geplant ? ''5px 8px 5px 12px'' : ''9px 8px 9px 12px''; ]]]'
      - border-radius: '0'
      - border: none
      - border-bottom: 1px solid var(--divider-color)
      - box-shadow: none
      - background: none
      - cursor: default
      grid:
      - grid-template-areas: '"info plus"'
      - grid-template-columns: 1fr 42px
      - column-gap: 8px
      - align-items: center
      custom_fields:
        info:
        - justify-self: stretch
        - min-width: '0'
        plus:
        - justify-self: end
    custom_fields:
      info:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                title: '[[[ return variables.titel ]]]'
                content:
                  type: markdown
                  content: |-
                    [[[
                      const v = variables;
                      return (v.bild ? `<img src="${v.bild}" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px">\n\n` : '')
                        + `**Im Angebot:** ${v.info}` + (v.mehr ? ` (${v.mehr})` : '') + (v.status ? `\n\n✓ ${v.status}` : '') + (v.zeit ? `\n\n**Dauer:** ${v.zeit}` : '')
                        + `\n\n### Zutaten\n` + v.zutaten.map(z => `- ${z}`).join('\n')
                        + `\n\n### Zubereitung\n` + v.schritte.map((s, i) => `${i + 1}. ${s.replace(/\s*\n+\s*/g, ' ')}`).join('\n');
                    ]]]
          styles:
            card:
            - padding: '0'
            - border: none
            - box-shadow: none
            - background: none
            - border-radius: '0'
            - cursor: pointer
            grid:
            - grid-template-areas: '"img text"'
            - grid-template-columns: '[[[ return variables.geplant ? ''40px 1fr'' : ''64px 1fr''; ]]]'
            - column-gap: 10px
            - align-items: center
            custom_fields:
              text:
              - justify-self: stretch
              - text-align: left
              - white-space: normal
              - min-width: '0'
              - overflow: hidden
          custom_fields:
            img: '[[[ const s = variables.geplant ? 40 : 64; return variables.bild ? `<img src="${variables.bild}" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:${s > 40 ? 10 : 8}px;display:block">` : `<div style="width:${s}px;height:${s}px;border-radius:10px;background:rgba(127,127,127,0.2)"></div>`; ]]]'
            text: |-
              [[[
                const v = variables;
                const rabatt = v.rabatt > 0 ? `<span style="font-size:11px;font-weight:600;color:#fff;background:#d6453d;border-radius:4px;padding:1px 5px">−${v.rabatt} %</span> ` : '';
                if (v.geplant) {
                  return `<div style="font-size:14px;line-height:1.3;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.name}</div>`
                    + `<div style="font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:#b5d98a;font-weight:600">✓ ${v.tag}</span>`
                    + (v.rabatt > 0 ? ` <span style="color:var(--secondary-text-color)">· ${rabatt}${v.info}</span>` : '') + `</div>`;
                }
                return `<div style="font-size:15px;line-height:1.3;font-weight:500">${v.name}</div><div style="font-size:12px;line-height:1.4;color:var(--secondary-text-color)">${rabatt}${v.info}</div>`
                  + (v.status ? `<div style="font-size:12px;line-height:1.3;color:var(--success-color, #43a047)">✓ ${v.status}</div>` : '')
                  + (v.mehr ? `<div style="font-size:12px;line-height:1.3;color:var(--secondary-text-color)">${v.mehr}</div>` : '');
              ]]]
      plus:
        card:
          type: custom:button-card
          icon: '[[[ return variables.geplant ? ''mdi:calendar-check'' : ''mdi:calendar-plus'' ]]]'
          show_name: false
          show_state: false
          styles:
            card:
            - width: 38px
            - height: 38px
            - padding: '0'
            - border-radius: 50%
            - border: none
            - box-shadow: none
            - background: '[[[ return variables.geplant ? ''rgba(181,217,138,0.16)'' : ''rgba(127,127,127,0.2)''; ]]]'
            icon:
            - width: 20px
            - color: '[[[ return variables.geplant ? ''#b5d98a'' : ''var(--primary-text-color)''; ]]]'
  rezept_kachel:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: '[[[ return variables.titel ]]]'
          content:
            type: markdown
            content: |-
              [[[
                const v = variables;
                return (v.bild ? `<img src="${v.bild}" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px">\n\n` : '')
                  + `**Im Angebot:** ${v.info}` + (v.mehr ? ` (${v.mehr})` : '') + (v.status ? `\n\n✓ ${v.status}` : '') + (v.zeit ? `\n\n**Dauer:** ${v.zeit}` : '')
                  + `\n\n### Zutaten\n` + v.zutaten.map(z => `- ${z}`).join('\n')
                  + `\n\n### Zubereitung\n` + v.schritte.map((s, i) => `${i + 1}. ${s.replace(/\s*\n+\s*/g, ' ')}`).join('\n');
              ]]]
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - padding: '0'
      - border: none
      - box-shadow: none
      - border-radius: 12px
      - overflow: hidden
      - background: rgba(127,127,127,0.14)
      - cursor: pointer
      grid:
      - grid-template-areas: '"k"'
      - grid-template-columns: 1fr
      custom_fields:
        k:
        - justify-self: stretch
        - min-width: '0'
    custom_fields:
      k: |-
        [[[
          const v = variables;
          const bild = v.bild ? `<img src="${v.bild}" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block">` : `<div style="width:100%;aspect-ratio:1/1;background:rgba(127,127,127,0.2)"></div>`;
          return `<div style="position:relative">${bild}<span style="position:absolute;left:5px;top:5px;background:#b5d98a;color:#1c2b12;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px">${v.tag}</span></div>`
            + `<div style="font-size:12px;line-height:1.25;padding:5px 6px 6px;text-align:left;white-space:normal;height:30px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${v.name}</div>`;
        ]]]
